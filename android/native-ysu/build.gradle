// YSU school companion: JWXT/CAS protocol, change diffing and notification copy
// for the official `ysu` background task adapter.

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

// Route identity comes from the build composition; this module never hardcodes
// the host activity, scheme or route hosts.
def deepLinkScheme = (gradle.ext.find('orahakoDeepLinkScheme') ?: 'orahako').toString()
def deepLinkHosts = gradle.ext.find('orahakoDeepLinkHosts') ?: [:]
def gradesHost = (deepLinkHosts['grades'] ?: 'grades').toString()
def examsHost = (deepLinkHosts['exams'] ?: 'exams').toString()
def settingsHost = (deepLinkHosts['settings'] ?: 'settings').toString()

android {
    namespace = "me.uwen.orahako.companion.ysu"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        manifestPlaceholders = [
            orahakoDeepLinkScheme  : deepLinkScheme,
            orahakoDeepLinkHostGrades: gradesHost,
            orahakoDeepLinkHostExams : examsHost,
            orahakoDeepLinkHostSettings: settingsHost,
        ]
        resValue "string", "orahako_ysu_host_grades", gradesHost
        resValue "string", "orahako_ysu_host_exams", examsHost
        resValue "string", "orahako_ysu_host_settings", settingsHost
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':native-core')
    implementation project(':native-academic')
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
}
