// Platform capabilities: APK/gallery files, WebView advisory, geolocation,
// system calendar sync, and the generic QuickJS background task runner.
// Owns the FileProvider and the storage/install/camera/location/calendar permissions.

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "me.uwen.orahako.nativebridge.capabilities"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

configurations.matching { it.name.endsWith("UnitTestRuntimeClasspath") }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module("io.github.dokar3:quickjs-kt-android"))
            .using(module("io.github.dokar3:quickjs-kt-jvm:1.0.0-alpha13"))
    }
}

dependencies {
    implementation project(':native-core')
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.github.dokar3:quickjs-kt:1.0.0-alpha13"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
}
