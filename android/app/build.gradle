apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Native composition selected by nativeComposition.gradle. The app never imports
// a concrete composition: it links the provider module and passes the provider
// class name through BuildConfig to NativeComposition.installFromProvider().
def nativeCompositionProviderModule = gradle.ext.find('orahakoNativeCompositionProviderModule')
def nativeCompositionProviderClass = gradle.ext.find('orahakoNativeCompositionProviderClass')
if (!nativeCompositionProviderModule?.toString()?.trim()) {
    throw new GradleException('nativeComposition.gradle must select a provider module')
}
if (!nativeCompositionProviderClass?.toString()?.trim()) {
    throw new GradleException('nativeComposition.gradle must select a provider class')
}
nativeCompositionProviderClass = nativeCompositionProviderClass.toString().trim()

android {
    namespace = "me.uwen.orahako"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "me.uwen.orahako"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName "1.6.0"
        def versionMatcher = versionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/
        if (!versionMatcher.matches()) {
            throw new GradleException("Invalid versionName: ${versionName}")
        }
        def major = versionMatcher[0][1].toInteger()
        def minor = versionMatcher[0][2].toInteger()
        def patch = versionMatcher[0][3].toInteger()
        def prereleaseStage = versionMatcher[0][4]
        def prereleaseNumber = versionMatcher[0][5] ? versionMatcher[0][5].toInteger() : 0
        def stageCode = 99
        if (prereleaseStage != null) {
            if (prereleaseNumber < 1) {
                throw new GradleException("Invalid prerelease number in versionName: ${versionName}")
            }
            if (prereleaseStage == "alpha") {
                if (prereleaseNumber > 19) {
                    throw new GradleException("alpha prerelease number must be 1..19: ${versionName}")
                }
                stageCode = prereleaseNumber
            } else if (prereleaseStage == "beta") {
                if (prereleaseNumber > 29) {
                    throw new GradleException("beta prerelease number must be 1..29: ${versionName}")
                }
                stageCode = 20 + prereleaseNumber
            } else if (prereleaseStage == "rc") {
                if (prereleaseNumber > 48) {
                    throw new GradleException("rc prerelease number must be 1..48: ${versionName}")
                }
                stageCode = 50 + prereleaseNumber
            }
        }
        versionCode major * 1000000 + minor * 10000 + patch * 100 + stageCode
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "NATIVE_COMPOSITION_PROVIDER", "\"${nativeCompositionProviderClass}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storeType 'PKCS12'
            storePassword project.findProperty('KEYSTORE_PASSWORD') ?: ''
            keyAlias project.findProperty('KEY_ALIAS') ?: 'orahako'
            keyPassword project.findProperty('KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // Native capability modules. The app mounts the generic core and the
    // composition provider selected in nativeComposition.gradle; every
    // capability implementation, permission and component is owned by a
    // companion module.
    implementation project(':native-core')
    implementation project(nativeCompositionProviderModule.toString())
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    debugImplementation("com.reqable.android:user-certificate-trust:1.0.0")
}

apply from: 'capacitor.build.gradle'

// Deterministic build failure for a missing or empty native composition.
// This complements the runtime provider loader, which fails loudly too.
tasks.register('verifyNativeComposition') {
    group = 'verification'
    description = 'Verifies the selected native composition provider and enabled capabilities.'
    doLast {
        def providerPath = nativeCompositionProviderClass.replace('.', '/')
        def providerProject = project(nativeCompositionProviderModule.toString())
        def providerSources = ['src/main/java', 'src/main/kotlin'].collect { providerProject.file(it) }
        def providerFound = providerSources.any { root ->
            new File(root, providerPath + '.kt').isFile() || new File(root, providerPath + '.java').isFile()
        }
        if (!providerFound) {
            throw new GradleException(
                "Native composition provider ${nativeCompositionProviderClass} was not found in " +
                    "${providerProject.path}; check nativeComposition.gradle"
            )
        }

        def companions = gradle.ext.find('orahakoOfficialNativeCompanions')
        if (companions == null || companions.isEmpty()) {
            throw new GradleException('No native companion modules are selected')
        }

        def widgetModules = gradle.ext.find('orahakoNativeWidgetCompositionModules') ?: [:]
        widgetModules.each { modulePath, className ->
            def classPath = className.toString().trim().replace('.', '/')
            def moduleProject = project(modulePath)
            def sources = ['src/main/java', 'src/main/kotlin'].collect { moduleProject.file(it) }
            def found = sources.any { root ->
                new File(root, classPath + '.kt').isFile() || new File(root, classPath + '.java').isFile()
            }
            if (!found) {
                throw new GradleException(
                    "Native composition module ${className} was not found in ${modulePath}"
                )
            }
        }

        def asset = file('src/main/assets/native-companion.json')
        if (!asset.isFile()) {
            throw new GradleException('Missing native companion asset: src/main/assets/native-companion.json')
        }
        def config = new groovy.json.JsonSlurper().parse(asset)
        if (config.version != 1) {
            throw new GradleException("Unsupported native companion config version: ${config.version}")
        }
        if (!(config.capabilities instanceof List) || config.capabilities.isEmpty()) {
            throw new GradleException(
                'native-companion.json must enable at least one native capability'
            )
        }

        def enabledIds = config.capabilities.collectMany { entry ->
            entry instanceof Map && entry.id instanceof String ? [entry.id] : []
        }
        if (enabledIds.size() != config.capabilities.size()) {
            throw new GradleException(
                'native-companion.json capability entries must all declare a string id'
            )
        }
        def widgetModuleByCapability = [
            'widgets.generic@1' : ':native-widgets',
            'widgets.schedule@1': ':native-widgets-schedule',
            'widgets.exam@1'    : ':native-widgets-exam',
        ]
        widgetModuleByCapability.each { capabilityId, modulePath ->
            if (capabilityId in enabledIds) {
                if (!(modulePath in companions)) {
                    throw new GradleException(
                        "Native capability $capabilityId requires companion module $modulePath"
                    )
                }
                if (modulePath != ':native-widgets' && !widgetModules.containsKey(modulePath)) {
                    throw new GradleException(
                        "Native capability $capabilityId requires composition module $modulePath"
                    )
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyNativeComposition')
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
