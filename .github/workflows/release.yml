name: Release Artifacts

# 维护者本地运行 scripts/release.sh 创建 GitHub Release 后，
# 本 workflow 自动构建 dist.zip、按需构建签名 APK 上传到该 Release（不可变产物），
# 并将对应通道元数据同步到 EdgeOne /api/version。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release-build-${{ github.event.release.tag_name }}
      cancel-in-progress: false

    outputs:
      version: ${{ steps.versions.outputs.version }}
      channel: ${{ steps.versions.outputs.channel }}
      apk_version_name: ${{ steps.versions.outputs.apk_version_name }}
      apk_version_code: ${{ steps.versions.outputs.apk_version_code }}
      built_apk: ${{ steps.apk-decision.outputs.should_build_apk }}

    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      VERSION_API_URL: ${{ vars.VERSION_API_URL || 'https://orahako.welain.com/api/version' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 镜像已预装 Android SDK（含 cmdline-tools/latest 与近期 platform），
      # 无需 setup-android；该 action 会执行 sdkmanager tools，而 cmdline-tools 16.0
      # 已移除 legacy tools 包导致步骤失败。
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Zip static export
        working-directory: dist
        run: zip -r ../dist.zip . -x '*.DS_Store'

      - name: Sync to Capacitor
        run: npx cap sync

      - name: Compute versions
        id: versions
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          CHANNEL=$(node - <<'NODE'
          const semver = require('semver');
          const pre = semver.prerelease(require('./package.json').version);
          if (!pre || pre.length === 0) {
            process.stdout.write('stable');
          } else {
            const tag = String(pre[0]).toLowerCase();
            process.stdout.write(tag === 'beta' || tag === 'rc' ? 'beta' : 'canary');
          }
          NODE
          )
          read -r APK_VERSION_NAME APK_VERSION_CODE < <(cd android && ./gradlew -q :app:printReleaseVersion)
          {
            echo "VERSION=$VERSION"
            echo "CHANNEL=$CHANNEL"
            echo "APK_VERSION_NAME=$APK_VERSION_NAME"
            echo "APK_VERSION_CODE=$APK_VERSION_CODE"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "apk_version_name=$APK_VERSION_NAME"
            echo "apk_version_code=$APK_VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Web version: $VERSION ($CHANNEL) / Android: $APK_VERSION_NAME ($APK_VERSION_CODE)"

      - name: Decide APK build
        id: apk-decision
        run: |
          set -euo pipefail
          SHOULD_BUILD_APK="true"
          if [[ "${CHANNEL}" != "stable" ]]; then
            SHOULD_BUILD_APK="false"
            STABLE_APK_CODE=0
            EXISTING_APK_URL=""
            MANIFEST_FILE=$(mktemp)
            if curl -fsS "${VERSION_API_URL}" -o "${MANIFEST_FILE}" 2>/dev/null; then
              STABLE_APK_CODE=$(jq -r '.channels.stable.apkVersionCode // .apkVersionCode // 0' "${MANIFEST_FILE}")
              EXISTING_APK_URL=$(jq -r --arg ch "$CHANNEL" --argjson code "$APK_VERSION_CODE" '
                (if $ch == "canary" then [.channels.canary, .channels.beta] else [.channels[$ch]] end)
                | map(select(. != null and (.apkVersionCode // 0) == $code and ((.apkDownloadUrl // "") != "")))
                | .[0].apkDownloadUrl // ""
              ' "${MANIFEST_FILE}")
            fi
            if (( APK_VERSION_CODE > STABLE_APK_CODE )) && [[ -z "${EXISTING_APK_URL}" ]]; then
              SHOULD_BUILD_APK="true"
            fi
          fi
          echo "SHOULD_BUILD_APK=$SHOULD_BUILD_APK" >> "$GITHUB_ENV"
          echo "should_build_apk=$SHOULD_BUILD_APK" >> "$GITHUB_OUTPUT"
          echo "Build APK: $SHOULD_BUILD_APK"

      - name: Decode keystore
        if: env.SHOULD_BUILD_APK == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "::error::KEYSTORE_BASE64 secret not set — cannot sign release APK"
            exit 1
          fi

      - name: Build release APK
        if: env.SHOULD_BUILD_APK == 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'

      - name: Stage APK asset
        if: env.SHOULD_BUILD_APK == 'true'
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "app-release-${VERSION}.apk"

      - name: Upload build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${SHOULD_BUILD_APK}" == "true" ]]; then
            gh release upload "$TAG" --repo "$REPO" \
              dist.zip "app-release-${VERSION}.apk" --clobber
          else
            gh release upload "$TAG" --repo "$REPO" \
              dist.zip --clobber
          fi

  sync-version:
    needs: build
    runs-on: ubuntu-latest
    # 串行同步通道元数据，避免并发发版乱序写入。
    concurrency:
      group: release-version-sync
      cancel-in-progress: false

    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      VERSION: ${{ needs.build.outputs.version }}
      APK_VERSION_CODE: ${{ needs.build.outputs.apk_version_code }}
      BUILT_APK: ${{ needs.build.outputs.built_apk }}
      VERSION_API_URL: ${{ vars.VERSION_API_URL || 'https://orahako.welain.com/api/version' }}

    steps:
      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$REPO" --json body -q .body > release-notes.txt

      - name: Build channel payload
        run: |
          set -euo pipefail
          BODY=$(cat release-notes.txt)
          DIST_URL="https://github.com/${REPO}/releases/download/${TAG}/dist.zip"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/app-release-${VERSION}.apk"

          if [[ "${CHANNEL}" == "stable" ]]; then
            jq -n \
              --arg channel "stable" \
              --arg webVersion "$VERSION" \
              --arg webDownloadUrl "$DIST_URL" \
              --arg apkDownloadUrl "$APK_URL" \
              --arg body "$BODY" \
              --argjson apkVersionCode "$APK_VERSION_CODE" \
              '{
                channel: $channel,
                webVersion: $webVersion,
                webDownloadUrl: $webDownloadUrl,
                apkVersionCode: $apkVersionCode,
                minApkVersionCode: $apkVersionCode,
                apkDownloadUrl: $apkDownloadUrl,
                body: $body
              }' > channel-payload.json
          else
            CURRENT_FILE=$(mktemp)
            echo '{}' > "$CURRENT_FILE"
            if curl -fsS "${VERSION_API_URL}" -o "$CURRENT_FILE" 2>/dev/null; then
              :
            else
              echo "::warning::existing /api/version unavailable; syncing ${CHANNEL} without prior metadata"
            fi

            STABLE_APK_CODE=$(jq -r '.channels.stable.apkVersionCode // .apkVersionCode // 0' "$CURRENT_FILE")
            REUSABLE_APK_URL=$(jq -r --arg ch "$CHANNEL" --argjson code "$APK_VERSION_CODE" '
              (if $ch == "canary" then [.channels.canary, .channels.beta] else [.channels[$ch]] end)
              | map(select(. != null and (.apkVersionCode // 0) == $code and ((.apkDownloadUrl // "") != "")))
              | .[0].apkDownloadUrl // ""
            ' "$CURRENT_FILE")

            if [[ "${BUILT_APK}" == "true" ]]; then
              jq -n \
                --arg channel "$CHANNEL" \
                --arg webVersion "$VERSION" \
                --arg webDownloadUrl "$DIST_URL" \
                --arg apkDownloadUrl "$APK_URL" \
                --arg body "$BODY" \
                --argjson apkVersionCode "$APK_VERSION_CODE" \
                '{
                  channel: $channel,
                  webVersion: $webVersion,
                  webDownloadUrl: $webDownloadUrl,
                  apkVersionCode: $apkVersionCode,
                  minApkVersionCode: $apkVersionCode,
                  apkDownloadUrl: $apkDownloadUrl,
                  body: $body
                }' > channel-payload.json
            elif (( APK_VERSION_CODE > STABLE_APK_CODE )) && [[ -n "${REUSABLE_APK_URL}" ]]; then
              jq -n \
                --arg channel "$CHANNEL" \
                --arg webVersion "$VERSION" \
                --arg webDownloadUrl "$DIST_URL" \
                --arg apkDownloadUrl "$REUSABLE_APK_URL" \
                --arg body "$BODY" \
                --argjson apkVersionCode "$APK_VERSION_CODE" \
                --argjson minApkVersionCode "$APK_VERSION_CODE" \
                '{
                  channel: $channel,
                  webVersion: $webVersion,
                  webDownloadUrl: $webDownloadUrl,
                  apkVersionCode: $apkVersionCode,
                  minApkVersionCode: $minApkVersionCode,
                  apkDownloadUrl: $apkDownloadUrl,
                  body: $body
                }' > channel-payload.json
            else
              jq -n \
                --arg channel "$CHANNEL" \
                --arg webVersion "$VERSION" \
                --arg webDownloadUrl "$DIST_URL" \
                --arg body "$BODY" \
                --argjson minApkVersionCode "$APK_VERSION_CODE" \
                '{
                  channel: $channel,
                  webVersion: $webVersion,
                  webDownloadUrl: $webDownloadUrl,
                  minApkVersionCode: $minApkVersionCode,
                  body: $body
                }' > channel-payload.json
            fi
          fi

          cat channel-payload.json

      - name: Sync channel to EdgeOne /api/version
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "::error::RELEASE_TOKEN secret not set — cannot sync /api/version"
            exit 1
          fi
          curl -fsS -X PUT "${VERSION_API_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            --data-binary @channel-payload.json
          echo ""
