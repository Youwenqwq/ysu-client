name: Release Artifacts

# 维护者本地运行 scripts/release.sh 创建 GitHub Release 后，
# 本 workflow 自动构建 dist.zip、按需构建签名 APK、生成 version.json 并上传到该 Release。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release-build-${{ github.event.release.tag_name }}
      cancel-in-progress: false

    outputs:
      version: ${{ steps.versions.outputs.version }}
      apk_version_name: ${{ steps.versions.outputs.apk_version_name }}
      apk_version_code: ${{ steps.versions.outputs.apk_version_code }}
      built_apk: ${{ steps.apk-decision.outputs.should_build_apk }}

    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      IS_PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 镜像已预装 Android SDK（含 cmdline-tools/latest 与近期 platform），
      # 无需 setup-android；该 action 会执行 sdkmanager tools，而 cmdline-tools 16.0
      # 已移除 legacy tools 包导致步骤失败。
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Zip static export
        working-directory: dist
        run: zip -r ../dist.zip . -x '*.DS_Store'

      - name: Compute versions
        id: versions
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          read -r APK_VERSION_NAME APK_VERSION_CODE < <(cd android && ./gradlew -q :app:printReleaseVersion)
          {
            echo "VERSION=$VERSION"
            echo "APK_VERSION_NAME=$APK_VERSION_NAME"
            echo "APK_VERSION_CODE=$APK_VERSION_CODE"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "apk_version_name=$APK_VERSION_NAME"
            echo "apk_version_code=$APK_VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Web version: $VERSION / Android: $APK_VERSION_NAME ($APK_VERSION_CODE)"

      - name: Decide APK build
        id: apk-decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOULD_BUILD_APK="true"
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            SHOULD_BUILD_APK="false"
            LATEST_STABLE_TAG=$(gh api "repos/${REPO}/releases/latest" -q .tag_name 2>/dev/null || true)
            STABLE_APK_CODE=0
            PREV_PRE_APK_CODE=0
            if [[ -n "${LATEST_STABLE_TAG}" ]]; then
              STABLE_DIR=$(mktemp -d)
              if gh release download "${LATEST_STABLE_TAG}" --repo "${REPO}" \
                  --pattern "version.json" --dir "${STABLE_DIR}" 2>/dev/null; then
                STABLE_APK_CODE=$(jq -r '.channels.stable.apkVersionCode // .apkVersionCode // 0' "${STABLE_DIR}/version.json")
                PREV_PRE_APK_CODE=$(jq -r '.channels.prerelease.apkVersionCode // 0' "${STABLE_DIR}/version.json")
              fi
            fi
            if (( APK_VERSION_CODE > STABLE_APK_CODE && APK_VERSION_CODE != PREV_PRE_APK_CODE )); then
              SHOULD_BUILD_APK="true"
            fi
          fi
          echo "SHOULD_BUILD_APK=$SHOULD_BUILD_APK" >> "$GITHUB_ENV"
          echo "should_build_apk=$SHOULD_BUILD_APK" >> "$GITHUB_OUTPUT"
          echo "Build APK: $SHOULD_BUILD_APK"

      - name: Decode keystore
        if: env.SHOULD_BUILD_APK == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "::error::KEYSTORE_BASE64 secret not set — cannot sign release APK"
            exit 1
          fi

      - name: Sync to Capacitor
        if: env.SHOULD_BUILD_APK == 'true'
        run: npx cap sync

      - name: Build release APK
        if: env.SHOULD_BUILD_APK == 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'

      - name: Stage APK asset
        if: env.SHOULD_BUILD_APK == 'true'
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "app-release-${VERSION}.apk"

      - name: Upload build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${SHOULD_BUILD_APK}" == "true" ]]; then
            gh release upload "$TAG" --repo "$REPO" \
              dist.zip "app-release-${VERSION}.apk" --clobber
          else
            gh release upload "$TAG" --repo "$REPO" \
              dist.zip --clobber
          fi

  manifest:
    needs: build
    runs-on: ubuntu-latest
    # 串行更新 version.json，避免并发发版时读到旧基底互相覆盖通道信息。
    concurrency:
      group: release-manifest
      cancel-in-progress: false

    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
      VERSION: ${{ needs.build.outputs.version }}
      APK_VERSION_CODE: ${{ needs.build.outputs.apk_version_code }}
      BUILT_APK: ${{ needs.build.outputs.built_apk }}

    steps:
      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$REPO" --json body -q .body > release-notes.txt

      - name: Generate version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(cat release-notes.txt)
          DIST_URL="https://github.com/${REPO}/releases/download/${TAG}/dist.zip"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/app-release-${VERSION}.apk"

          BASE_FILE=$(mktemp)
          echo '{}' > "$BASE_FILE"

          # stable 发布时以「上一个 stable release」的 version.json 为基底，
          # 继承其中的 channels.prerelease，避免每次 stable 发版清空预览通道信息。
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            PREV_STABLE_TAG=$(gh api "repos/${REPO}/releases" --paginate \
              -q '[.[] | select(.prerelease == false and .draft == false and .tag_name != "'"${TAG}"'")][0].tag_name // ""' 2>/dev/null || true)
            if [[ -n "${PREV_STABLE_TAG}" ]]; then
              PREV_DIR=$(mktemp -d)
              if gh release download "${PREV_STABLE_TAG}" --repo "${REPO}" \
                  --pattern "version.json" --dir "${PREV_DIR}" 2>/dev/null; then
                cp "${PREV_DIR}/version.json" "$BASE_FILE"
              else
                echo "::warning::previous stable version.json unavailable; starting from empty manifest"
              fi
            fi

            jq \
              --arg webVersion "$VERSION" \
              --arg webDownloadUrl "$DIST_URL" \
              --arg apkDownloadUrl "$APK_URL" \
              --arg body "$BODY" \
              --argjson apkVersionCode "$APK_VERSION_CODE" \
              '. + {
                apkVersionCode: $apkVersionCode,
                minApkVersionCode: $apkVersionCode,
                webVersion: $webVersion,
                webDownloadUrl: $webDownloadUrl,
                apkDownloadUrl: $apkDownloadUrl,
                body: $body
              }
              | .channels = ((.channels // {}) + {
                stable: {
                  apkVersionCode: $apkVersionCode,
                  minApkVersionCode: $apkVersionCode,
                  webVersion: $webVersion,
                  webDownloadUrl: $webDownloadUrl,
                  apkDownloadUrl: $apkDownloadUrl,
                  body: $body
                }
              })' \
              "$BASE_FILE" > version.json
          else
            LATEST_STABLE_TAG=$(gh api "repos/${REPO}/releases/latest" -q .tag_name 2>/dev/null || true)
            if [[ -n "${LATEST_STABLE_TAG}" ]]; then
              STABLE_DIR=$(mktemp -d)
              if gh release download "${LATEST_STABLE_TAG}" --repo "${REPO}" \
                  --pattern "version.json" --dir "${STABLE_DIR}" 2>/dev/null; then
                cp "${STABLE_DIR}/version.json" "$BASE_FILE"
              else
                echo "::warning::stable version.json unavailable; prerelease manifest will not include stable metadata"
              fi
            else
              echo "::warning::no stable release found; prerelease manifest will not include stable metadata"
            fi

            STABLE_APK_CODE=$(jq -r '.channels.stable.apkVersionCode // .apkVersionCode // 0' "$BASE_FILE")
            PREV_PRE_APK_CODE=$(jq -r '.channels.prerelease.apkVersionCode // 0' "$BASE_FILE")
            PREV_PRE_APK_URL=$(jq -r '.channels.prerelease.apkDownloadUrl // ""' "$BASE_FILE")

            if [[ "${BUILT_APK}" == "true" ]]; then
              jq \
                --arg webVersion "$VERSION" \
                --arg webDownloadUrl "$DIST_URL" \
                --arg apkDownloadUrl "$APK_URL" \
                --arg body "$BODY" \
                --argjson apkVersionCode "$APK_VERSION_CODE" \
                '.channels = ((.channels // {}) + {
                  prerelease: {
                    webVersion: $webVersion,
                    webDownloadUrl: $webDownloadUrl,
                    apkVersionCode: $apkVersionCode,
                    minApkVersionCode: $apkVersionCode,
                    apkDownloadUrl: $apkDownloadUrl,
                    body: $body
                  }
                })' \
                "$BASE_FILE" > version.json
            elif (( APK_VERSION_CODE > STABLE_APK_CODE && APK_VERSION_CODE == PREV_PRE_APK_CODE )) && [[ -n "${PREV_PRE_APK_URL}" ]]; then
              jq \
                --arg webVersion "$VERSION" \
                --arg webDownloadUrl "$DIST_URL" \
                --arg apkDownloadUrl "$PREV_PRE_APK_URL" \
                --arg body "$BODY" \
                --argjson apkVersionCode "$PREV_PRE_APK_CODE" \
                --argjson minApkVersionCode "$APK_VERSION_CODE" \
                '.channels = ((.channels // {}) + {
                  prerelease: {
                    webVersion: $webVersion,
                    webDownloadUrl: $webDownloadUrl,
                    apkVersionCode: $apkVersionCode,
                    minApkVersionCode: $minApkVersionCode,
                    apkDownloadUrl: $apkDownloadUrl,
                    body: $body
                  }
                })' \
                "$BASE_FILE" > version.json
            else
              jq \
                --arg webVersion "$VERSION" \
                --arg webDownloadUrl "$DIST_URL" \
                --arg body "$BODY" \
                --argjson minApkVersionCode "$APK_VERSION_CODE" \
                '.channels = ((.channels // {}) + {
                  prerelease: {
                    webVersion: $webVersion,
                    webDownloadUrl: $webDownloadUrl,
                    minApkVersionCode: $minApkVersionCode,
                    body: $body
                  }
                })' \
                "$BASE_FILE" > version.json
            fi
          fi

          cat version.json

      - name: Upload version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$REPO" version.json --clobber

      # OTA 检查固定走 releases/latest/download/version.json（latest 永远指向最新
      # stable），因此 prerelease 合并后的 manifest 必须同步覆盖到最新 stable
      # release 上，prerelease 通道的用户才能看到 channels.prerelease 更新。
      - name: Sync version.json to latest stable release
        if: ${{ github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_STABLE_TAG=$(gh api "repos/${REPO}/releases/latest" -q .tag_name 2>/dev/null || true)
          if [[ -z "${LATEST_STABLE_TAG}" ]]; then
            echo "::warning::no stable release found; skipping version.json sync"
            exit 0
          fi
          gh release upload "${LATEST_STABLE_TAG}" --repo "${REPO}" version.json --clobber
